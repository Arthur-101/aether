<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 512 512" role="img" aria-label="Aether">
<title>Aether small app icon</title>
  <!--
    Small-size edition for 16–32 px. The full mark's pill and inner dash ring
    collapse into noise at that scale, so this keeps a solid outer ring, the
    active arc and a bold three-bar core. Segment gaps are deliberately dropped
    here: at 32 px they read as noise, while the solid ring stays crisp.
  -->
  <rect width="464" height="464" x="24" y="24" rx="108" fill="#0F1218" stroke="#242A36" stroke-width="4" />

  <circle cx="256" cy="268" r="148" fill="none" stroke="#F4F6FA" stroke-opacity="0.54" stroke-width="42" />
  <path d="M 294 125 A 148 148 0 0 1 388 201" fill="none" stroke="#FFFFFF" stroke-width="48" stroke-linecap="round" />

  <circle cx="256" cy="268" r="92" fill="#151A23" stroke="#F4F6FA" stroke-opacity="0.3" stroke-width="8" />
  <g fill="#F4F6FA">
    <rect x="207" y="248" width="20" height="40" rx="10" />
    <rect x="285" y="248" width="20" height="40" rx="10" />
  </g>
  <rect x="243" y="210" width="26" height="116" rx="13" fill="#FFFFFF" />
</svg>
